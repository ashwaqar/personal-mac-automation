settings:
  dry_run: false
  duplicate_detection: true
  bootstrap_folders: true

paths:
  downloads_dir: ~/Downloads
  auto_archive_dir: ~/Downloads/AutoArchive
  trash_later_dir: ~/Downloads/TrashLater
  to_review_dir: ~/Downloads/ToReview
  media_incoming_dir: ~/Media/Videos/Incoming
  media_assets_dir: ~/Media/Assets/Downloads
  log_file: ~/Projects/personal-mac-automation/logs/download-manager.log

bootstrap_dirs:
  # Projects
  - ~/Projects/Active
  - ~/Projects/Learning
  - ~/Projects/Ideas
  - ~/Projects/Experiments
  - ~/Projects/Completed
  # Notes
  - ~/Notes/ObsidianVault
  # Media
  - ~/Media/Videos/ToSort
  - ~/Media/Videos/Raw
  - ~/Media/Videos/Final
  - ~/Media/Photos
  - ~/Media/ScreenRecordings
  - ~/Media/Audio
  - ~/Media/Exports
  # Documents
  - ~/Documents/Finance
  - ~/Documents/Insurance
  - ~/Documents/Travel
  - ~/Documents/Certificates
  - ~/Documents/Purchases
  - ~/Documents/Family
  # Archive
  - ~/Archive/Projects
  - ~/Archive/Documents
  - ~/Archive/Media
  - ~/Archive/Downloads

rules:
  dmg:
    archive_after_days: 3
    trash_after_days: 14
    delete_after_days: 30

  pkg:
    archive_after_days: 3
    trash_after_days: 14
    delete_after_days: 30

  zip:
    archive_after_days: 7
    trash_after_days: 30
    delete_after_days: 60

  pdf:
    archive_after_days: 30
    trash_after_days: 90
    delete_after_days: 120

  docx:
    archive_after_days: 30
    trash_after_days: 90
    delete_after_days: 120

  xlsx:
    archive_after_days: 30
    trash_after_days: 90
    delete_after_days: 120

  mp4:
    route: media

  mov:
    route: media

  mkv:
    route: media

  mp3:
    route: media_assets

  wav:
    route: media_assets

default:
  route: review
  archive_after_days: 14
